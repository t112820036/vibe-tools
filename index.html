<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>準度訓練 - CyberAim Metallic</title>
  <!-- Google Fonts: 科技字型 Orbitron & Rajdhani -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       金屬科技風設計系統 (Metallic Cyber Aesthetic)
       ========================================================================== */

    :root {
      --bg-dark: #0a0c10;
      --metal-base: #1c222d;
      --metal-light: #384356;
      --metal-border: #4a5870;
      --cyan-glow: #00f3ff;
      --laser-red: #ff0055;
      --gold-accent: #ffb700;
      --font-tech: 'Orbitron', sans-serif;
      --font-num: 'Rajdhani', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1a202c 0%, var(--bg-dark) 100%);
      color: #e2e8f0;
      font-family: var(--font-tech);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 頁面切換機制 */
    .page {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    .page.active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* ================= 金屬質感面板 ================= */
    .metal-panel {
      background: linear-gradient(135deg, #252d3c 0%, #11151c 100%);
      border: 1px solid var(--metal-border);
      box-shadow: 
        0 0 20px rgba(0, 0, 0, 0.8),
        inset 0 1px 1px rgba(255, 255, 255, 0.2),
        inset 0 -1px 2px rgba(0, 0, 0, 0.8);
      border-radius: 8px;
      position: relative;
      padding: 40px;
    }

    .lobby-panel {
      width: 90%;
      max-width: 550px;
      text-align: center;
    }

    /* 金屬裝飾角規 */
    .tech-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border: 2px solid var(--cyan-glow);
    }
    .tech-corner.top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .tech-corner.top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .tech-corner.bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .tech-corner.bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* 標題與字體 */
    .metal-title {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(180deg, #ffffff 30%, #8a9bb8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--cyan-glow);
      letter-spacing: 3px;
      margin-top: 5px;
      margin-bottom: 30px;
    }

    /* 儀表板看板 */
    .stats-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat-box {
      background: rgba(10, 12, 16, 0.6);
      border: 1px solid rgba(74, 88, 112, 0.5);
      padding: 12px 5px;
      border-radius: 4px;
    }

    .stat-label {
      display: block;
      font-size: 0.75rem;
      color: #7a8b9e;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-num);
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* 音效開關 */
    .audio-toggle-container {
      margin-bottom: 30px;
    }
    .switch-label {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      gap: 10px;
    }
    .switch-label input { display: none; }
    .metal-switch {
      width: 40px;
      height: 20px;
      background: #0d1015;
      border: 1px solid var(--metal-border);
      border-radius: 10px;
      position: relative;
      transition: 0.3s;
    }
    .metal-switch::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      background: #7a8b9e;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: 0.3s;
    }
    .switch-label input:checked + .metal-switch {
      border-color: var(--cyan-glow);
      box-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }
    .switch-label input:checked + .metal-switch::after {
      left: 22px;
      background: var(--cyan-glow);
    }
    .switch-text {
      font-size: 0.85rem;
      color: #a0aec0;
    }

    /* 金屬質感按鈕 */
    .btn-metal-primary {
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(180deg, #3a475c 0%, #19202b 100%);
      border: 1px solid var(--cyan-glow);
      color: #ffffff;
      font-family: var(--font-tech);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .btn-metal-primary:hover {
      background: linear-gradient(180deg, #4c5d78 0%, #222c3b 100%);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
      transform: translateY(-1px);
    }

    .btn-metal-primary:active {
      transform: translateY(1px);
    }

    /* ================= 第二頁：HUD 與 訓練場地 ================= */
    #page-training {
      padding: 20px;
      gap: 15px;
    }

    .hud-header {
      display: flex;
      gap: 20px;
      background: rgba(17, 21, 28, 0.85);
      border: 1px solid var(--metal-border);
      padding: 12px 30px;
      border-radius: 6px;
      backdrop-filter: blur(5px);
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 100px;
    }

    .hud-label {
      font-size: 0.7rem;
      color: #7a8b9e;
      letter-spacing: 1px;
    }

    .hud-value {
      font-family: var(--font-num);
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
    }

    .hud-item.highlight .hud-value {
      color: var(--cyan-glow);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.8);
    }

    /* 長方形訓練區域 */
    #arena-container {
      width: 100%;
      max-width: 960px;
      height: 600px;
      max-height: 70vh;
    }

    .metal-arena {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #151a24 0%, #0a0c10 100%);
      border: 2px solid var(--metal-border);
      border-radius: 6px;
      box-shadow: 
        inset 0 0 30px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;

      /* ⚡ 強制訓練區及其內部所有元素保持科技十字準心 ⚡ */
      cursor: crosshair !important;
    }

    .metal-arena * {
      /* 強制確保 hover 在標靶、粒子或波紋上時都不會恢復為預設指標 */
      cursor: crosshair !important;
    }

    /* 網格背景紋理 */
    .arena-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ================= 標靶 (Target Mechanics) ================= */
    /* 半徑 2mm 規格：標準 96DPI 屏幕下 1mm ≈ 3.78px，2mm 半徑 => 直徑 ≈ 15px */
    .target {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff, var(--laser-red));
      border: 1px solid #ffffff;
      box-shadow: 
        0 0 10px var(--laser-red),
        0 0 20px var(--laser-red);
      position: absolute;
      z-index: 10;
      /* 確保圓點上懸停絕不改變游標 */
      cursor: crosshair !important;
    }

    /* 擊中與未擊中特效 */
    .hit-spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan-glow);
      box-shadow: 0 0 6px var(--cyan-glow);
      pointer-events: none;
      animation: spark-fade 0.3s ease-out forwards;
    }

    @keyframes spark-fade {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(3) translate(var(--dx), var(--dy)); opacity: 0; }
    }

    .miss-ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 1px solid rgba(255, 0, 85, 0.6);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: ripple-out 0.25s ease-out forwards;
    }

    @keyframes ripple-out {
      0% { width: 0; height: 0; opacity: 1; }
      100% { width: 30px; height: 30px; opacity: 0; }
    }

    /* ================= 結算彈窗 (Modal) ================= */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-panel {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .modal-title {
      color: var(--cyan-glow);
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .grade-badge {
      font-size: 4rem;
      font-weight: 900;
      color: var(--gold-accent);
      text-shadow: 0 0 20px rgba(255, 183, 0, 0.6);
      margin-bottom: 20px;
    }

    .summary-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(10, 12, 16, 0.6);
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 25px;
      text-align: left;
      font-size: 0.95rem;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      color: #a0aec0;
    }

    .summary-item strong {
      color: #ffffff;
      font-family: var(--font-num);
    }
  </style>
</head>
<body>

  <!-- ================= 第一頁：主選單大廳 ================= -->
  <div id="page-landing" class="page active">
    <div class="metal-panel lobby-panel">
      <div class="tech-corner top-left"></div>
      <div class="tech-corner top-right"></div>
      <div class="tech-corner bottom-left"></div>
      <div class="tech-corner bottom-right"></div>

      <div class="title-container">
        <h1 class="metal-title" data-text="準度訓練">準度訓練</h1>
        <p class="subtitle">CYBERAIM PRECISION TRAINER v2.0</p>
      </div>

      <!-- 統計數據看板 -->
      <div class="stats-board">
        <div class="stat-box">
          <span class="stat-label">最佳擊中數</span>
          <span id="best-hits" class="stat-value">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">最高命中率</span>
          <span id="best-accuracy" class="stat-value">0.0%</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">平均反應</span>
          <span id="best-reaction" class="stat-value">0ms</span>
        </div>
      </div>

      <!-- 開啟/關閉音效設定 -->
      <div class="audio-toggle-container">
        <label class="switch-label">
          <input type="checkbox" id="sound-toggle" checked>
          <span class="metal-switch"></span>
          <span class="switch-text">戰術音效 (Audio Synthesizer)</span>
        </label>
      </div>

      <!-- 開始按鈕 -->
      <button id="btn-start" class="btn-metal-primary">
        <span class="btn-glow"></span>
        <span class="btn-text">開始訓練</span>
      </button>
    </div>
  </div>

  <!-- ================= 第二頁：訓練場地 ================= -->
  <div id="page-training" class="page">
    <!-- 頂部 HUD 計分板 -->
    <header class="hud-header">
      <div class="hud-item highlight">
        <span class="hud-label">剩餘時間</span>
        <span id="hud-timer" class="hud-value timer-glow">60.0s</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">擊中數量</span>
        <span id="hud-hits" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">當前命中率</span>
        <span id="hud-accuracy" class="hud-value">100.0%</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">平均反應</span>
        <span id="hud-reaction" class="hud-value">0ms</span>
      </div>
    </header>

    <!-- 核心訓練區域 (長方形金屬框) -->
    <main id="arena-container">
      <div id="arena" class="metal-arena">
        <div class="arena-grid"></div>
        <!-- 隨機生成的半徑 2mm (直徑 15px) 金屬標靶 -->
        <div id="target" class="target" style="display: none;"></div>
      </div>
    </main>
  </div>

  <!-- ================= 結算彈窗 (Modal) ================= -->
  <div id="modal-summary" class="modal-overlay">
    <div class="metal-panel modal-panel">
      <h2 class="modal-title">訓練任務完成</h2>
      <div class="grade-badge" id="summary-grade">S</div>
      
      <div class="summary-grid">
        <div class="summary-item">
          <span>總發射次數:</span>
          <strong id="summary-shots">0</strong>
        </div>
        <div class="summary-item">
          <span>成功擊中:</span>
          <strong id="summary-hits">0</strong>
        </div>
        <div class="summary-item">
          <span>最終命中率:</span>
          <strong id="summary-accuracy">0%</strong>
        </div>
        <div class="summary-item">
          <span>平均反應時間:</span>
          <strong id="summary-reaction">0ms</strong>
        </div>
      </div>

      <button id="btn-return" class="btn-metal-primary">
        <span class="btn-text">返回主頁</span>
      </button>
    </div>
  </div>

  <script>
    /**
     * CyberAim Precision Trainer - Core Engine
     */

    document.addEventListener('DOMContentLoaded', () => {
      // 頁面元素引用
      const pageLanding = document.getElementById('page-landing');
      const pageTraining = document.getElementById('page-training');
      const modalSummary = document.getElementById('modal-summary');

      const btnStart = document.getElementById('btn-start');
      const btnReturn = document.getElementById('btn-return');
      const soundToggle = document.getElementById('sound-toggle');

      const arena = document.getElementById('arena');
      const target = document.getElementById('target');

      // HUD 元素
      const hudTimer = document.getElementById('hud-timer');
      const hudHits = document.getElementById('hud-hits');
      const hudAccuracy = document.getElementById('hud-accuracy');
      const hudReaction = document.getElementById('hud-reaction');

      // 最佳統計與結算元素
      const bestHitsEl = document.getElementById('best-hits');
      const bestAccEl = document.getElementById('best-accuracy');
      const bestReactEl = document.getElementById('best-reaction');

      const summaryShots = document.getElementById('summary-shots');
      const summaryHits = document.getElementById('summary-hits');
      const summaryAcc = document.getElementById('summary-accuracy');
      const summaryReact = document.getElementById('summary-reaction');
      const summaryGrade = document.getElementById('summary-grade');

      // 遊戲狀態變數
      let totalShots = 0;
      let hits = 0;
      let timeLeft = 60.0;
      let timerInterval = null;
      let isGameActive = false;
      let targetSpawnTime = 0;
      let reactionTimes = [];

      // Web Audio API 音效合成器
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        if (!soundToggle.checked) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'hit') {
          // 擊中音效：高頻清脆雷射聲
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'miss') {
          // 脫靶音效：低沉挫折音
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(80, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'finish') {
          // 完成音效：三連音提示
          [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.2, now + idx * 0.12);
            g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.2);
            o.start(now + idx * 0.12);
            o.stop(now + idx * 0.12 + 0.2);
          });
        }
      }

      // 讀取最高紀錄
      function loadBestScores() {
        const bestHits = localStorage.getItem('cyberaim_best_hits') || '0';
        const bestAcc = localStorage.getItem('cyberaim_best_acc') || '0.0%';
        const bestReact = localStorage.getItem('cyberaim_best_react') || '0ms';

        bestHitsEl.textContent = bestHits;
        bestAccEl.textContent = bestAcc;
        bestReactEl.textContent = bestReact;
      }

      // 隨機生成 2mm 標靶位置
      function spawnTarget() {
        const arenaRect = arena.getBoundingClientRect();
        const targetSize = 15; // 2mm 半徑 ≈ 15px 直徑

        // 限制在長方形區域內
        const maxX = arenaRect.width - targetSize;
        const maxY = arenaRect.height - targetSize;

        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY);

        target.style.left = `${randomX}px`;
        target.style.top = `${randomY}px`;
        target.style.display = 'block';

        targetSpawnTime = performance.now();
      }

      // 擊中粒子效果
      function createSparks(x, y) {
        for (let i = 0; i < 6; i++) {
          const spark = document.createElement('div');
          spark.className = 'hit-spark';
          spark.style.left = `${x}px`;
          spark.style.top = `${y}px`;

          const angle = Math.random() * Math.PI * 2;
          const dist = 15 + Math.random() * 20;
          spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

          arena.appendChild(spark);
          setTimeout(() => spark.remove(), 300);
        }
      }

      // 脫靶波紋效果
      function createMissRipple(x, y) {
        const ripple = document.createElement('div');
        ripple.className = 'miss-ripple';
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        arena.appendChild(ripple);
        setTimeout(() => ripple.remove(), 250);
      }

      // 更新 HUD 數據
      function updateHUD() {
        hudHits.textContent = hits;
        const acc = totalShots > 0 ? ((hits / totalShots) * 100).toFixed(1) : '100.0';
        hudAccuracy.textContent = `${acc}%`;

        if (reactionTimes.length > 0) {
          const avgReact = Math.round(
            reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length
          );
          hudReaction.textContent = `${avgReact}ms`;
        } else {
          hudReaction.textContent = '0ms';
        }
      }

      // 開始訓練遊戲
      function startGame() {
        totalShots = 0;
        hits = 0;
        timeLeft = 60.0;
        reactionTimes = [];
        isGameActive = true;

        updateHUD();
        hudTimer.textContent = '60.0s';

        pageLanding.classList.remove('active');
        pageTraining.classList.add('active');

        spawnTarget();

        // 60秒倒數計時器
        const startTime = performance.now();
        timerInterval = setInterval(() => {
          const elapsed = (performance.now() - startTime) / 1000;
          timeLeft = Math.max(0, 60.0 - elapsed);
          hudTimer.textContent = `${timeLeft.toFixed(1)}s`;

          if (timeLeft <= 0) {
            endGame();
          }
        }, 50);
      }

      // 結束訓練
      function endGame() {
        isGameActive = false;
        clearInterval(timerInterval);
        target.style.display = 'none';

        playSound('finish');

        // 計算總結
        const acc = totalShots > 0 ? ((hits / totalShots) * 100).toFixed(1) : '0.0';
        const avgReact = reactionTimes.length > 0
          ? Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length)
          : 0;

        summaryShots.textContent = totalShots;
        summaryHits.textContent = hits;
        summaryAcc.textContent = `${acc}%`;
        summaryReact.textContent = `${avgReact}ms`;

        // 評級判定
        let grade = 'C';
        const accNum = parseFloat(acc);
        if (accNum >= 90 && hits >= 80) grade = 'S';
        else if (accNum >= 80 && hits >= 60) grade = 'A';
        else if (accNum >= 70 && hits >= 40) grade = 'B';
        summaryGrade.textContent = grade;

        // 儲存最佳紀錄
        const prevBestHits = parseInt(localStorage.getItem('cyberaim_best_hits') || '0', 10);
        if (hits > prevBestHits) {
          localStorage.setItem('cyberaim_best_hits', hits);
          localStorage.setItem('cyberaim_best_acc', `${acc}%`);
          localStorage.setItem('cyberaim_best_react', `${avgReact}ms`);
        }

        modalSummary.classList.add('active');
      }

      // 點擊事件：標靶擊中
      target.addEventListener('mousedown', (e) => {
        if (!isGameActive) return;
        e.stopPropagation(); // 阻止冒泡到 arena 觸發脫靶

        const hitTime = performance.now();
        reactionTimes.push(hitTime - targetSpawnTime);

        hits++;
        totalShots++;

        playSound('hit');

        const rect = arena.getBoundingClientRect();
        createSparks(e.clientX - rect.left, e.clientY - rect.top);

        updateHUD();
        spawnTarget();
      });

      // 點擊事件：訓練區脫靶
      arena.addEventListener('mousedown', (e) => {
        if (!isGameActive) return;

        totalShots++;
        playSound('miss');

        const rect = arena.getBoundingClientRect();
        createMissRipple(e.clientX - rect.left, e.clientY - rect.top);

        updateHUD();
      });

      // 返回主頁按鈕
      btnReturn.addEventListener('click', () => {
        modalSummary.classList.remove('active');
        pageTraining.classList.remove('active');
        pageLanding.classList.add('active');
        loadBestScores();
      });

      // 開始按鈕點擊
      btnStart.addEventListener('click', startGame);

      // 初始化載入歷史最佳紀錄
      loadBestScores();
    });
  </script>
</body>
</html>
